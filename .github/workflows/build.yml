name: Build APK

on:
  push:
    branches:
      - main
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install emoji renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji
          python3 -m pip install --upgrade pillow

      - name: Generate real PNG emoji sheets
        run: python3 tools/generate_emoji_sheets.py

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/musab/customemojis/MainActivity.java
          test -f app/src/main/java/com/musab/customemojis/CustomEmojiKeyboardService.java
          test -f app/src/main/res/xml/method.xml
          test -s app/src/main/res/drawable-nodpi/emoji_skins.png
          test -s app/src/main/res/drawable-nodpi/special_emojis.png
          python3 - <<'PY'
from PIL import Image
from pathlib import Path
checks = [
    (Path("app/src/main/res/drawable-nodpi/emoji_skins.png"), (12, 8)),
    (Path("app/src/main/res/drawable-nodpi/special_emojis.png"), (11, 8)),
]
for path, (cols, rows) in checks:
    with Image.open(path) as im:
        assert im.width % cols == 0 and im.height % rows == 0, path
        print(path, im.size)
PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes[0-9]*\.dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'res/drawable-nodpi/(emoji_skins|special_emojis)\.png'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-emojis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
